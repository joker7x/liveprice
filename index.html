<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DWA Prices Premium - أسعار الأدوية</title>
    <meta name="description" content="تطبيق DWA Prices لمتابعة أحدث أسعار الأدوية في مصر، تحديثات لحظية، تصميم عصري، ويدعم الوضع الليلي." />
    <meta name="theme-color" content="#f2f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="DWA Prices Premium" />
    <meta property="og:description" content="تابع أسعار الأدوية أول بأول مع تجربة استخدام فاخرة وسلسة." />
    <meta property="og:type" content="website" />
    
    <!-- Scripts & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                950: '#020617',
              }
            }
          }
        }
      }
    </script>

    <style>
      :root {
        --glass-border: rgba(255, 255, 255, 0.6);
        --glass-bg: rgba(255, 255, 255, 0.75);
        --glass-shadow: 0 4px 20px rgba(0,0,0,0.02);
      }

      /* Dark Mode Variables Override */
      .dark {
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-bg: rgba(15, 23, 42, 0.65); /* Slate-900 with opacity */
        --glass-shadow: 0 4px 20px rgba(0,0,0,0.25);
      }

      body {
        font-family: 'Tajawal', 'Inter', sans-serif;
        background-color: #f2f6fa;
        /* PREVENT SCROLL BOUNCE */
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.5s ease;
      }
      
      .dark body {
        background-color: #020617; /* Slate 950 */
      }
      
      html {
        scroll-behavior: smooth;
        overscroll-behavior-y: none;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Kept for Header/Nav/Settings only */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "framer-motion": "https://esm.sh/framer-motion@11.0.3?external=react,react-dom",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
